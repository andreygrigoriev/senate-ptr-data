name: scrape

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start date (yyyy-MM-dd); empty = last 60 days"
        required: false
        default: ""
      capture:
        description: "Upload raw eFD pages as an artifact (fixtures) instead of scraping"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Capture raw pages
        if: ${{ inputs.capture }}
        run: ./mvnw -q -DskipTests package exec:java -Dexec.args="data/senate --capture capture"
      - name: Upload capture
        if: ${{ inputs.capture }}
        uses: actions/upload-artifact@v4
        with:
          name: efd-capture
          path: capture/
      - name: Scrape
        if: ${{ !inputs.capture }}
        run: ./mvnw -q -DskipTests package exec:java -Dexec.args="data/senate ${{ inputs.from != '' && format('--from {0}', inputs.from) || '' }}"
      - name: Commit data
        if: ${{ always() && !inputs.capture }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
